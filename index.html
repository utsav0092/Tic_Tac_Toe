<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe - Retro Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <!-- Landing Page -->
        <div id="landing-page" class="active">
            <h1>Tic Tac Toe</h1>
            <p>Choose your game mode</p>
            <div class="mode-buttons">
                <button onclick="selectMode('twoPlayer')" class="btn-primary">Two Player</button>
                <button onclick="selectMode('ai')" class="btn-secondary">AI Opponent</button>
            </div>
        </div>

        <!-- Game Page -->
        <div id="game-page">
            <div class="header">
                <button onclick="goBack()" class="back-btn">← Back</button>
                <h2 id="mode-title">Two Player Mode</h2>
            </div>

            <div class="game-container">
                <div class="board" id="board">
                    <div class="cell" id="0"></div>
                    <div class="cell" id="1"></div>
                    <div class="cell" id="2"></div>
                    <div class="cell" id="3"></div>
                    <div class="cell" id="4"></div>
                    <div class="cell" id="5"></div>
                    <div class="cell" id="6"></div>
                    <div class="cell" id="7"></div>
                    <div class="cell" id="8"></div>
                </div>
            </div>

            <div class="endgame" id="endgame">
                <div class="text"></div>
                <button onclick="startGame()">Play Again</button>
                <button onclick="goBack()" class="menu-btn">Main Menu</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
